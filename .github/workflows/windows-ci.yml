name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Initialize test configuration
        shell: pwsh
        run: ./scripts/bootstrap-local-ai.ps1
      - name: Run core tests
        run: dotnet run --project local-chat/tests/QwenLocalChat.Tests/QwenLocalChat.Tests.csproj -c Release
      - name: Check WinUI structure
        shell: powershell
        run: ./local-chat/tests/verify-winui-ui-baseline.ps1
      - name: Compile WinUI x64
        run: dotnet build local-chat/src/QwenLocalChat.WinUI/QwenLocalChat.WinUI.csproj -c Debug -p:Platform=x64 -p:GenerateAppxPackageOnBuild=false
